# verlog/conf/logging.conf
[loggers]
keys=root,promptGenerator,summarizer

[handlers]
keys=consoleHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[logger_promptGenerator]
level=INFO
handlers=consoleHandler
qualname=verlog.prompt_generator
propagate=0

[logger_summarizer]
level=INFO
handlers=consoleHandler
qualname=verlog.summarizer
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[formatter_simpleFormatter]
format=%(levelname)s - %(name)s - %(message)s